name: robot_controller
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_joystick: ^0.2.2
  google_fonts: ^6.3.2
  provider: ^6.1.5+1
  web_socket_channel: ^3.0.3
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/img/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0C1A10"
  adaptive_icon_foreground: "assets/img/logo_fg.png"


flutter_native_splash:
  color: "#0C1A10"
  image: assets/img/logo_fg.png
  android_12:
    color: "#0C1A10"
    image: assets/img/logo_fg.png