slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Robust loss so ONE bad scan match (easy to get with zero odometry --
    # see notes below) doesn't drag the whole pose-graph optimization badly
    # off course. None was fine while matching almost never ran at all (the
    # frozen-gate bug); now that it runs continuously, a bad match without
    # this can compound into runaway map corruption (confirmed: saw the map
    # explode from ~7.7x5.5m to ~19.4x14.3m of pure noise in one session).
    ceres_loss_function: HuberLoss

    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_scan_matching: true
    use_scan_barycenter: true
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 12.0
    # Was 0.2 (5Hz), then 0.5. Slowed again to 1.0 to fight DOUBLE WALLS.
    # With zero odometry every inserted scan is another chance to lay the
    # same wall down at a slightly wrong pose; at 2Hz that included scans
    # taken while essentially stationary, so pose jitter alone smeared walls
    # into thick fuzzy bands (measured: wall pixels went 242 -> 500 while the
    # mapped area grew only 20%). Fewer, better-separated insertions means
    # fewer ghost copies AND more genuine geometry between scans for the
    # matcher to lock onto. Don't push this much past ~1.5s: too much
    # displacement between scans and matching starts failing outright
    # (correlation_search_space_dimension below is only 1.2m).
    minimum_time_interval: 1.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    # These gate "has the robot moved enough since the last processed scan
    # to bother re-matching?" -- measured from the ODOM frame's reported
    # motion. Since odom->base_link is a permanently static/zero transform
    # in this system (no odometry hardware, see slam.launch.py), that
    # measured travel is ALWAYS exactly zero no matter how far the Lidar
    # actually moves -- so with these >0, slam_toolbox processes its first
    # scan at startup and then NEVER re-evaluates anything again (confirmed:
    # /pose never publishes, map->odom stays pure identity forever). Set to
    # 0 so it stops gating on that frozen estimate and instead attempts
    # every scan, throttled only by minimum_time_interval below (max 5Hz) --
    # now it has to rely entirely on scan-matching to notice motion at all,
    # which is what we actually want here.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    scan_buffer_size: 10
    use_sim_time: false

    # ---- scan-matching search space (no odometry in this system --
    # odom->base_link is a permanently static/zero transform, see
    # slam.launch.py -- so slam_toolbox has NO motion prior at all and must
    # find each new scan's alignment purely by searching around the last
    # corrected pose. Real tradeoff either direction:
    #   too NARROW (default ~0.5m) -> can't find big jumps at all, map
    #     freezes/stays tiny (the original symptom).
    #   too WIDE (3.0m, tried first) -> happily "finds" a plausible-but-
    #     WRONG match far from the truth when there's no prior to rule it
    #     out, especially matching every scan at 5Hz -- confirmed: this is
    #     what produced the exploding/starburst-noise map.
    # 1.2m is a middle ground: enough room for real hand-carried movement
    # between the (now slower, see minimum_time_interval) match attempts,
    # without inviting false matches from across the whole room. Retune
    # down toward the 0.5 default once real (smooth, continuous) driving
    # motion replaces hand-carried testing -- it'll need much less slack.
    correlation_search_space_dimension: 1.2
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.1

    # ---- loop closure: the one mechanism that actually REPAIRS double walls
    # after the fact. When it recognises you've returned to somewhere already
    # mapped, it re-optimises the pose graph and pulls the duplicated walls
    # back on top of each other. Default search radius (3.0m) is small for a
    # room-scale hand-carried test, so widen it -- more candidates considered,
    # more chances to fire. The match-response thresholds are deliberately
    # left at their defaults: LOWERING those to force more closures risks a
    # FALSE closure, which corrupts the whole map far worse than double walls.
    do_loop_closing: true
    loop_search_maximum_distance: 6.0
